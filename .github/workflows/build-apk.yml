name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Setup Capacitor & Generate App Icon
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          # Hapus config lama yang bikin error
          rm -f capacitor.config.ts capacitor.config.js capacitor.config.json
          
          # Bikin config baru yang 100% aman dan langsung jalan
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.starfx.app",
            "appName": "STARFX",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          
          # Paksa bikin folder dist dan android
          mkdir -p dist
          npx cap add android
          
          # Atur urusan Logo (icon.png)
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
          fi
          
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android || true
          fi
          
          npx cap sync android || true

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Fix Kotlin Duplicate Class Error
        run: |
          if [ -f "android/build.gradle" ]; then
            echo "" >> android/build.gradle
            echo "allprojects {" >> android/build.gradle
            echo "    configurations.all {" >> android/build.gradle
            echo "        resolutionStrategy {" >> android/build.gradle
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> android/build.gradle
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" >> android/build.gradle
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> android/build.gradle
            echo "        }" >> android/build.gradle
            echo "    }" >> android/build.gradle
            echo "}" >> android/build.gradle
          fi

      - name: Build APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Folder android tidak ditemukan"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STARFX-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
